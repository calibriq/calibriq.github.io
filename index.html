<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Judgment Diagnostic — how calibrated is your trust in AI?</title>
<meta name="description" content="A 90-second diagnostic on when to trust, verify, or override AI in assessment. Sometimes trusting is the calibrated call.">
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --border: #e5e2da;
    --text: #1a1a18;
    --text-secondary: #6b6a63;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success: #3b6d11;
    --success-bg: #eaf3de;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --warning: #854f0b;
    --warning-bg: #faeeda;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 64px;
    line-height: 1.6;
  }
  .container { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  .subtitle { color: var(--text-secondary); font-size: 15px; margin: 0; }
  .progress { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  .tag-label {
    display: inline-block; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--accent); background: var(--accent-bg);
    padding: 3px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  .prompt { font-size: 17px; line-height: 1.7; margin: 0 0 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button {
    font-family: inherit; font-size: 15px; text-align: left;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
    color: var(--text); transition: border-color 0.15s ease, background 0.15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
  button:disabled { cursor: default; opacity: 0.55; }
  .feedback-card { border-radius: var(--radius); padding: 16px; margin: 16px 0; }
  .feedback-card.correct { background: var(--success-bg); }
  .feedback-card.incorrect { background: var(--danger-bg); }
  .feedback-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .feedback-label.correct { color: var(--success); }
  .feedback-label.incorrect { color: var(--danger); }
  .feedback-text { font-size: 14px; color: var(--text-secondary); }
  .next-btn { background: var(--text); color: #fff; border: none; text-align: center; font-weight: 600; width: 100%; }
  .next-btn:hover { opacity: 0.9; background: var(--text); }
  .result-score { text-align: center; padding: 8px 0 24px; }
  .result-score .num { font-size: 40px; font-weight: 700; margin: 4px 0 12px; }
  .result-tag {
    display: inline-block; font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent);
  }
  .direction-note {
    font-size: 14px; color: var(--text-secondary); text-align: center;
    margin: -8px 0 24px; padding: 0 6px;
  }
  .breakdown { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 14px;
  }
  .icon-check { color: var(--success); font-weight: 700; }
  .icon-x { color: var(--danger); font-weight: 700; }
  .cta-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; text-align: left;
    font-size: 14px; color: var(--text-secondary);
  }
  .cta-box strong { color: var(--text); }
  footer { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 40px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>How calibrated is your trust in AI?</h1>
    <p class="subtitle">5 situations from AI-graded assessment. Trust, verify, or override. Sometimes trusting is the right call.</p>
  </header>
  <div id="app"></div>
  <footer>Built to test judgment, not just usage.</footer>
</div>

<script>
const scenarios = [
  {
    tag: "Inconsistency",
    mode: "Inconsistency",
    prompt: "An AI marker gives two nearly identical short answers, submitted minutes apart, scores of 4 out of 7 and 7 out of 7. Same rubric, no feedback explaining the gap.",
    options: [
      { label: "Trust the scores, the model may have seen something you didn't", type: "trust", correct: false },
      { label: "Re-mark both against the rubric yourself", type: "verify", correct: true },
      { label: "Override both to the average", type: "override", correct: false }
    ],
    reveal: "You can't tell which score is right from the outputs alone, only that they can't both be. Re-marking is the calibrated move. Averaging just launders the inconsistency into a number you still can't defend."
  },
  {
    tag: "Bias",
    mode: "Bias",
    prompt: "Across a batch, the AI tutor's feedback runs warmer and its scores run higher for answers in polished academic English, even when the reasoning is no stronger than plainer-worded answers.",
    options: [
      { label: "Trust it, tone doesn't change the grading logic", type: "trust", correct: false },
      { label: "Re-score a blind sample, rubric only, with writing style stripped out", type: "verify", correct: true },
      { label: "Override every formal-English score downward", type: "override", correct: false }
    ],
    reveal: "A style-linked pattern is a bias signal, not proof that any single score is wrong. A blind, rubric-only recheck confirms or clears it. Blanket-correcting just swaps one bias for another."
  },
  {
    tag: "Confidently wrong",
    mode: "Confidently wrong",
    prompt: "An AI marks a maths answer correct and explains, fluently and confidently, that 51 is a prime number. You can see that 51 is 3 times 17.",
    options: [
      { label: "Trust it, the explanation is clear and confident", type: "trust", correct: false },
      { label: "Ask for a second opinion before doing anything", type: "verify", correct: false },
      { label: "Correct the mark and the explanation now", type: "override", correct: true }
    ],
    reveal: "This one isn't ambiguous, you can see the error. When a mistake is plainly checkable, verifying further is just dithering. The calibrated move is to act. Fluency and confidence are not accuracy."
  },
  {
    tag: "Gaming",
    mode: "Gaming",
    prompt: "An essay scores full marks. Reading it, it is a wall of rubric phrases (critical analysis, multiple perspectives, robust evidence) with no actual argument, evidence or reasoning behind them.",
    options: [
      { label: "Trust the score, it hit every rubric term", type: "trust", correct: false },
      { label: "Leave it for now and check other high scorers first", type: "verify", correct: false },
      { label: "Override the score to reflect the missing content", type: "override", correct: true }
    ],
    reveal: "Matching rubric language is not the same as meeting the rubric. You've already read this one and seen it's empty, so it calls for action, not more checking. Spot-checking other high scorers is a good habit, but a separate one."
  },
  {
    tag: "Reliable system",
    mode: "control",
    prompt: "Your AI marker was independently checked against expert human marks on 12,000 scripts this term and agreed within one mark 98 percent of the time. On a low-stakes weekly formative quiz, it returns a batch of scores that look right at a glance.",
    options: [
      { label: "Accept the scores and spend your time on the high-risk cases", type: "trust", correct: true },
      { label: "Re-mark the whole batch by hand anyway", type: "verify", correct: false },
      { label: "Override any score you'd have graded a point differently", type: "override", correct: false }
    ],
    reveal: "Calibration runs both ways. On a validated system doing low-stakes work, re-marking everything burns the scarce human attention you need for the cases that actually carry risk. Trusting here is the calibrated call. Over-checking is its own failure mode."
  }
];

const actions = {
  "Inconsistency": "Flag any pair of near-identical inputs that score more than a set threshold apart for manual review.",
  "Bias": "Run a periodic rubric-only re-check on a sample, split by writing style.",
  "Gaming": "Spot-check a sample of high-scoring answers for genuine understanding, not just keyword match.",
  "Confidently wrong": "Require a second human check on any AI explanation above a confidence threshold before it reaches a student.",
  "control": "Calibration cuts both ways. Don't spend scarce human review on a validated system doing low-stakes work, save it for the high-risk cases."
};

let current = 0;
let score = 0;
let answers = [];      // was the choice correct
let chosenTypes = [];  // trust / verify / override

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  const app = document.getElementById('app');
  if (current < scenarios.length) {
    const s = scenarios[current];
    app.innerHTML = `
      <div class="progress">Scenario ${current + 1} of ${scenarios.length}</div>
      <div class="tag-label">${s.tag}</div>
      <p class="prompt">${s.prompt}</p>
      <div class="options" id="opts"></div>
      <div id="feedback"></div>
    `;
    const optsDiv = document.getElementById('opts');
    shuffle(s.options).forEach((o) => {
      const btn = document.createElement('button');
      btn.textContent = o.label;
      btn.onclick = () => choose(o);
      optsDiv.appendChild(btn);
    });
  } else {
    showResult();
  }
}

function choose(opt) {
  answers.push(opt.correct);
  chosenTypes.push(opt.type);
  if (opt.correct) score++;
  const s = scenarios[current];
  document.getElementById('opts').querySelectorAll('button').forEach(b => b.disabled = true);
  document.getElementById('feedback').innerHTML = `
    <div class="feedback-card ${opt.correct ? 'correct' : 'incorrect'}">
      <div class="feedback-label ${opt.correct ? 'correct' : 'incorrect'}">${opt.correct ? 'Calibrated' : 'Not calibrated'}</div>
      <div class="feedback-text">${s.reveal}</div>
    </div>
    <button class="next-btn" id="next">${current === scenarios.length - 1 ? 'See result' : 'Next scenario'}</button>
  `;
  document.getElementById('next').onclick = () => { current++; render(); };
}

function directionNote() {
  const misses = answers.filter(a => !a).length;
  if (misses === 0) return "";
  // over-trust: chose "trust" when it was wrong
  const overTrust = scenarios.filter((s, i) => chosenTypes[i] === "trust" && !answers[i]).length;
  // over-caution: the calibrated answer was "trust" but they didn't take it
  const overCaution = scenarios.filter((s, i) => {
    const correctOpt = s.options.find(o => o.correct);
    return correctOpt.type === "trust" && !answers[i];
  }).length;
  if (overTrust > 0 && overCaution === 0) return "Your misses lean one way: trusting AI more readily than the situation warranted.";
  if (overCaution > 0 && overTrust === 0) return "Your misses lean the other way: checking or overriding output that was already reliable.";
  if (overTrust > 0 && overCaution > 0) return "Your misses run in both directions, sometimes trusting too much, sometimes checking what didn't need it.";
  return "Your read on when to trust was sound. The misses were about timing: checking when you could already act, or acting when you still needed to check.";
}

function showResult() {
  const app = document.getElementById('app');
  const total = scenarios.length;
  let tag = "Calibrated";
  if (score <= 2) tag = "Miscalibrated";
  else if (score <= total - 1) tag = "Building calibration";

  const missed = scenarios.filter((s, i) => !answers[i]);
  const note = directionNote();

  app.innerHTML = `
    <div class="result-score">
      <div style="font-size:13px;color:var(--text-secondary);">Your score</div>
      <div class="num">${score} / ${total}</div>
      <div class="result-tag">${tag}</div>
    </div>
    ${note ? `<div class="direction-note">${note}</div>` : ``}
    <div class="breakdown">
      ${scenarios.map((s, i) => `
        <div class="breakdown-row">
          <span>${s.tag}</span>
          <span class="${answers[i] ? 'icon-check' : 'icon-x'}">${answers[i] ? '✓' : '✗'}</span>
        </div>
      `).join('')}
    </div>
    ${missed.length > 0 ? `
      <div class="cta-box">
        <strong>What to do about the ones you missed:</strong><br><br>
        ${missed.map(s => `${s.tag}: ${actions[s.mode]}`).join('<br><br>')}
      </div>
    ` : `
      <div class="cta-box"><strong>Strong calibration.</strong> You matched your response to the situation every time, including knowing when to leave a reliable system alone.</div>
    `}
  `;
}

render();
</script>
</body>
</html>
